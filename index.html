<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFinder - Αναζήτηση Ταινιών</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <h1>MovieFinder</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Αρχική</a></li>
                <li><a href="#">Δημοφιλείς</a></li>
                <li><a href="#">Νέες Κυκλοφορίες</a></li>
                <li><a href="#">Κατηγορίες</a></li>
            </ul>
        </nav>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Αναζήτηση ταινιών...">
        <button id="search-button"><i class="fas fa-search"></i></button>
    </div>

    <main>
        <section class="featured">
            <h2>Προτεινόμενες Ταινίες</h2>
            <div class="movies-grid" id="featured-movies"></div>
        </section>

        <section class="popular">
            <h2>Δημοφιλείς Ταινίες</h2>
            <div class="movies-grid" id="popular-movies"></div>
        </section>

        <section class="new-releases">
            <h2>Νέες Κυκλοφορίες</h2>
            <div class="movies-grid" id="new-movies"></div>
        </section>
    </main>

    <!-- Σελίδα λεπτομερειών ταινίας (αρχικά κρυμμένη) -->
    <div class="movie-details" id="movie-details">
        <button class="close-button" id="close-details">×</button>
        <div class="movie-details-content" id="movie-details-content"></div>
    </div>

    <!-- Περιοχή αποτελεσμάτων αναζήτησης (αρχικά κρυμμένη) -->
    <section class="search-results" id="search-results-section">
        <h2>Αποτελέσματα Αναζήτησης</h2>
        <div class="movies-grid" id="search-results"></div>
    </section>

    <footer>
        <p>&copy; 2025 MovieFinder - Εφαρμογή Αναζήτησης Ταινιών</p>
        <p>Powered by TMDB API</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
